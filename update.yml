name: Cập nhật bài từ Telegram
on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 giờ Việt Nam, mỗi ngày
  workflow_dispatch:       # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_telegram.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Cập nhật bài mới" && git push)
